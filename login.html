<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Login</title><link rel="stylesheet" href="./css/style.css"/></head><body><main class="auth"><form class="card" id="loginForm"><h1>Login</h1><span data-setup-warning></span><input name="email" type="email" placeholder="Email" required/><input name="password" type="password" placeholder="Password" required/><button>Login</button><a href="register.html">Create account</a><p data-error></p></form></main><script type="module">import{login}from'./js/auth.js';document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);try{await login(form.get('email'),form.get('password'));location.href='index.html'}catch(error){document.querySelector('[data-error]').textContent=error.message}});</script></body></html>
