<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Register</title><link rel="stylesheet" href="./css/style.css"/></head><body><main class="auth"><form class="card" id="registerForm"><h1>Create account</h1><span data-setup-warning></span><input name="leader" placeholder="Leader name" required/><input name="email" type="email" placeholder="Email" required/><input name="password" type="password" placeholder="Password" minlength="6" required/><button>Register</button><a href="login.html">Already have an account</a><p data-error></p></form></main><script type="module">import{register}from'./js/auth.js';document.getElementById('registerForm').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);try{await register(form.get('email'),form.get('password'),form.get('leader'));location.href='country.html'}catch(error){document.querySelector('[data-error]').textContent=error.message}});</script></body></html>
