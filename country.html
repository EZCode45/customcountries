<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Country</title><link rel="stylesheet" href="./css/style.css"/></head><body><nav><a href="index.html">World</a><a href="country.html">Country</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a><a href="admin.html">Admin</a><span data-auth-nav></span></nav><main class="shell"><section class="grid"><form class="card" id="countryForm"><h1>Create country</h1><input name="name" placeholder="Country name" required/><input name="leaderName" placeholder="Leader name" required/><input name="capital" placeholder="Capital city" required/><input name="flag" placeholder="Flag image URL"/><input name="color" type="color" value="#2dd4bf"/><textarea name="description" placeholder="Description"></textarea><div class="statsForm"><input name="economy" type="number" value="25"/><input name="population" type="number" value="10"/><input name="technology" type="number" value="1"/><input name="military" type="number" value="10"/></div><button>Create</button><p data-status></p></form><section class="card"><h1>Existing countries</h1><div data-countries></div></section><section class="card wide"><h1>Diplomacy</h1><form data-diplomacy-form><select name="fromCountry"></select><select name="toCountry"></select><select name="type"><option>Alliance</option><option>Peace Treaty</option><option>Trade Agreement</option></select><button>Send request</button></form><div data-diplomacy-list></div></section></section></main><script type="module">import{requireUser}from'./js/auth.js';import{createCountry,joinCountry,watchCountries}from'./js/countries.js';requireUser(user=>{const list=document.querySelector('[data-countries]');watchCountries(countries=>{list.innerHTML=countries.map(country=>`<article class="mini"><span class="dot" style="background:${country.color}"></span><strong>${country.name}</strong><span>${country.capital}</span><button data-join="${country.id}">Join</button></article>`).join('');list.querySelectorAll('[data-join]').forEach(button=>button.addEventListener('click',()=>joinCountry(button.dataset.join)))});document.getElementById('countryForm').addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));await createCountry(data);document.querySelector('[data-status]').textContent='Country created';event.currentTarget.reset()})});</script><script type="module" src="./js/diplomacy.js"></script></body></html>
