<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Profile</title><link rel="stylesheet" href="./css/style.css"/></head><body><nav><a href="index.html">World</a><a href="country.html">Country</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a><a href="admin.html">Admin</a><span data-auth-nav></span></nav><main class="shell"><section class="card"><h1>Player profile</h1><div data-profile></div></section></main><script type="module">import{requireUser}from'./js/auth.js';requireUser((user,profile)=>{document.querySelector('[data-profile]').innerHTML=`<div class="profile"><strong>${profile.leaderName||user.displayName||'Player'}</strong><span>${user.email}</span><span>Country: ${profile.countryId||'None'}</span><span>Joined: ${profile.joinedAt?.toDate?profile.joinedAt.toDate().toLocaleDateString():'Today'}</span><span>Achievements: ${(profile.achievements||['Founder']).join(', ')}</span></div>`});</script></body></html>
